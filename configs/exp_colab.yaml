exp_name: "wildtrack_baseline"

data_root: "/content/BEV_Track-Predict/wildtrack"

output_dir: "/content/BEV_Track-Predict/runs/wildtrack_baseline"

views: "0,1,2,3,4,5,6"
max_frames: -1
epochs: 10
batch_size: 1
pretrained: true
backbone: "resnet18"
fusion_mode: "confidence_v2"
augment: true
augment_hflip_prob: 0.0
augment_color_jitter: "0.2,0.2,0.2,0.05"
alpha: 1.0
optimizer: "adam"
scheduler: "cosine"
lr_init: 0.0001
max_lr: 0.01
momentum: 0.9
weight_decay: 0.0001
freeze_backbone_epochs: 3
det_moda_dist_m: 0.5

train_command:
  - "python"
  - "scripts/train_main.py"
  - "--data_root"
  - "/content/BEV_Track-Predict/wildtrack"
  - "--views"
  - "0,1,2,3,4,5,6"
  - "--max_frames"
  - "-1"
  - "--epochs"
  - "10"
  - "--batch"
  - "1"
  - "--pretrained"
  - "true"
  - "--backbone"
  - "resnet18"
  - "--fusion_mode"
  - "confidence_v2"
  - "--augment"
  - "true"
  - "--augment_hflip_prob"
  - "0.0"
  - "--augment_color_jitter"
  - "0.2,0.2,0.2,0.05"
  - "--alpha"
  - "1.0"
  - "--optimizer"
  - "adam"
  - "--scheduler"
  - "cosine"
  - "--lr_init"
  - "0.0001"
  - "--weight_decay"
  - "0.0001"
  - "--freeze_backbone_epochs"
  - "3"

target_metric: "det_moda"
target_value: 0.75

log_tail_lines: 500

git:
  branch: "main"
  result_dir: "ai_runs"
  latest_dir: "ai_runs/latest"
  history_dir: "ai_runs/history"
