name: Colab Training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: '训练轮数'
        default: '10'
        required: false
      gpu:
        description: 'GPU 型号（T4 / L4 / A100）'
        default: 'T4'
        required: false

jobs:
  train:
    name: Train on Colab ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install google-colab-cli

      - name: Restore Colab credentials
        env:
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          token = os.environ["COLAB_REFRESH_TOKEN"].strip()
          assert token, "COLAB_REFRESH_TOKEN is empty"
          creds = {
              "token": None,
              "refresh_token": token,
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": "764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com",
              "client_secret": "d-FL95Q19q7MQmFpd7hHD0Ty",
              "scopes": [
                  "openid",
                  "https://www.googleapis.com/auth/userinfo.profile",
                  "https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory",
                  "https://www.googleapis.com/auth/drive.file"
              ],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": None
          }
          path = os.path.expanduser("~/.config/colab-cli/token.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(creds, f)
          print("[OK] token.json constructed from refresh_token")
          EOF

      - name: Create Colab session
        run: colab new --gpu ${{ inputs.gpu }} --session bev-train

      # 用 gdown 从共享链接下载数据集，不再依赖 drive.mount()
      - name: Run training
        run: |
          {
            echo "import sys; sys.argv = ['colab_train.py', '--epochs', '${{ inputs.epochs }}']"
            cat scripts/colab_train.py
          } | colab exec -s bev-train --timeout 18000

      - name: Download checkpoint
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3"
          colab download -s bev-train "$REMOTE/model_final.pth" ./model_final.pth || true
          colab download -s bev-train "$REMOTE/metrics.csv"    ./metrics.csv      || true

      - name: Run detection evaluation
        if: success()
        run: |
          colab exec -s bev-train --timeout 600 <<'EVAL'
          import subprocess, sys
          cmd = (
              "cd /content/BEV_Track-Predict && "
              "python3 src/evaluate_main.py "
              "--data_root /content/BEV_Track-Predict/wildtrack "
              "--model_path outputs/train_multicam_mvdet_style_v3/model_final.pth "
              "--device cuda "
              "--report_detection "
              "--metrics_out outputs/eval_results.json "
              "--views 0,1,2,3,4,5,6"
          )
          print(f">>> {cmd}", flush=True)
          ret = subprocess.call(cmd, shell=True)
          print(f"\n[EVAL] exit code: {ret}", flush=True)
          EVAL

      - name: Generate prediction visualization
        if: success()
        run: |
          colab exec -s bev-train --timeout 300 <<'VIZ'
          import subprocess
          cmd = (
              "cd /content/BEV_Track-Predict && "
              "python3 scripts/visualize_prediction.py "
              "--model_path outputs/train_multicam_mvdet_style_v3/model_final.pth "
              "--data_root /content/BEV_Track-Predict/wildtrack "
              "--output outputs/visualization "
              "--frame 0"
          )
          print(f">>> {cmd}", flush=True)
          subprocess.check_call(cmd, shell=True)
          VIZ

      - name: Download evaluation results
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs"
          colab download -s bev-train "$REMOTE/eval_results.json" ./eval_results.json || true

      - name: Print evaluation summary
        if: always()
        run: |
          if [ -f eval_results.json ]; then
            python3 -c "
          import json
          r = json.load(open('eval_results.json'))
          print('=' * 50)
          print('EVALUATION RESULTS')
          print('=' * 50)
          for k in ['loss','pos_mse','aux_pos_mse']:
              print(f'{k:20s}: {r.get(k, \"N/A\"):.6f}' if isinstance(r.get(k), (int,float)) else f'{k:20s}: N/A')
          if 'det_moda' in r:
              print('-' * 50)
              print(f'{\"MODA\":20s}: {r[\"det_moda\"]:.4f}')
              print(f'{\"MODP\":20s}: {r[\"det_modp\"]:.4f}')
              print(f'{\"Precision\":20s}: {r[\"det_precision\"]:.4f}')
              print(f'{\"Recall\":20s}: {r[\"det_recall\"]:.4f}')
              print(f'{\"F1\":20s}: {r[\"det_f1\"]:.4f}')
              print(f'{\"Best Threshold\":20s}: {r[\"det_best_threshold\"]:.2f}')
              print(f'{\"TP/FP/FN\":20s}: {int(r[\"det_moda_tp\"])}/{int(r[\"det_moda_fp\"])}/{int(r[\"det_moda_fn\"])}')
          print('=' * 50)
          "
          else
            echo "[WARN] eval_results.json not found — evaluation may have failed"
          fi

      - name: Download visualization
        if: always()
        run: |
          VIZ_REMOTE="/content/BEV_Track-Predict/outputs/visualization"
          colab download -s bev-train "$VIZ_REMOTE/bev_prediction.png" ./bev_prediction.png || true
          colab download -s bev-train "$VIZ_REMOTE/bev_overlay.png"    ./bev_overlay.png    || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bev-checkpoint-run${{ github.run_number }}
          path: |
            model_final.pth
            metrics.csv
            eval_results.json
            bev_prediction.png
            bev_overlay.png
          if-no-files-found: warn

      - name: Stop Colab session
        if: always()
        run: colab stop -s bev-train || true
