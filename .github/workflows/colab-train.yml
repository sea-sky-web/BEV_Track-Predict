name: Colab Training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: '训练轮数'
        default: '10'
        required: false
      gpu:
        description: 'GPU 型号（T4 / L4 / A100）'
        default: 'T4'
        required: false
      bev_pos_weight:
        description: 'BEV 正样本损失权重（MVDet 标准 MSE = 1.0）'
        default: '1.0'
        required: false
      max_frames:
        description: '训练帧数上限（MVDet train split = 360）'
        default: '360'
        required: false
      loss_type:
        description: 'BEV loss 类型：mse (baseline) / focal (CenterNet-style)'
        default: 'mse'
        required: false
      offset_weight:
        description: 'Offset 回归 L1 loss 权重（0.0 = 禁用 offset loss）'
        default: '0.0'
        required: false
      checkpoint_run:
        description: 'eval-only: 从指定 GA run ID 下载 checkpoint（配合 epochs=0）'
        default: ''
        required: false
      fusion_mode:
        description: 'BEV 融合模式：confidence_v2 (baseline) / concat / confidence_v1 / geo_confidence_v1'
        default: 'confidence_v2'
        required: false

jobs:
  train:
    name: Train on Colab ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install google-colab-cli

      - name: Restore Colab credentials
        env:
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          token = os.environ["COLAB_REFRESH_TOKEN"].strip()
          assert token, "COLAB_REFRESH_TOKEN is empty"
          creds = {
              "token": None,
              "refresh_token": token,
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": "764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com",
              "client_secret": "d-FL95Q19q7MQmFpd7hHD0Ty",
              "scopes": [
                  "openid",
                  "https://www.googleapis.com/auth/userinfo.profile",
                  "https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory",
                  "https://www.googleapis.com/auth/drive.file"
              ],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": None
          }
          path = os.path.expanduser("~/.config/colab-cli/token.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(creds, f)
          print("[OK] token.json constructed from refresh_token")
          EOF

      - name: Kill stale sessions and create session
        run: |
          # Kill any existing session (may fail silently if none exists)
          colab stop -s bev-train 2>/dev/null || true
          sleep 15
          # Retry colab new up to 3 times with kill between attempts
          for attempt in 1 2 3; do
            echo "=== Create session attempt $attempt ==="
            colab new --gpu ${{ inputs.gpu }} --session bev-train && break
            echo "Attempt $attempt failed, killing stale and retrying in 30s..."
            colab stop -s bev-train 2>/dev/null || true
            sleep 30
          done

      - name: Upload checkpoint for eval-only
        if: inputs.checkpoint_run != '' && inputs.epochs == '0'
        run: |
          echo "Downloading checkpoint from run ${{ inputs.checkpoint_run }}..."
          gh run download ${{ inputs.checkpoint_run }} -D /tmp/ckpt 2>&1 || true
          CKPT=$(find /tmp/ckpt -name 'model_final.pth' | head -1)
          if [ -z "$CKPT" ]; then
            echo "[ERROR] model_final.pth not found in run ${{ inputs.checkpoint_run }} artifacts"
            exit 1
          fi
          echo "Found checkpoint: $CKPT ($(du -h "$CKPT" | cut -f1))"
          REMOTE="/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3"
          echo "import os; os.makedirs('$REMOTE', exist_ok=True)" | colab exec -s bev-train

          # `colab upload` on the full ~126M file reliably drops with SSLEOFError
          # (3/3 retries failed identically in runs 28937281619, 28943896817,
          # 28952018458) — the proxy connection can't sustain one long upload
          # stream. Split into small chunks so each upload is a short-lived
          # connection, then reassemble on the Colab side with cat.
          CHUNK_DIR=/tmp/ckpt_chunks
          mkdir -p "$CHUNK_DIR"
          split -b 8m "$CKPT" "$CHUNK_DIR/chunk_"
          echo "import os; os.makedirs('$REMOTE/_chunks', exist_ok=True)" | colab exec -s bev-train

          for part in "$CHUNK_DIR"/chunk_*; do
            name=$(basename "$part")
            for attempt in 1 2 3; do
              echo "=== Upload $name attempt $attempt ==="
              colab upload -s bev-train "$part" "$REMOTE/_chunks/$name" && break
              if [ "$attempt" -eq 3 ]; then
                echo "[ERROR] Checkpoint chunk $name failed after 3 attempts"
                exit 1
              fi
              echo "Attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
          done

          echo "import glob, shutil
          parts = sorted(glob.glob('$REMOTE/_chunks/chunk_*'))
          with open('$REMOTE/model_final.pth', 'wb') as out:
              for p in parts:
                  with open(p, 'rb') as f:
                      shutil.copyfileobj(f, out)
          shutil.rmtree('$REMOTE/_chunks')
          print('[OK] Reassembled', len(parts), 'chunks')
          " | colab exec -s bev-train
          echo "[OK] Checkpoint uploaded to Colab"
        env:
          GH_TOKEN: ${{ github.token }}

      # colab exec --timeout is inactivity timeout. Set high (7200s=2h) so long training
      # doesn't disconnect. The step-level timeout-minutes=240 is the hard wall.
      # continue-on-error lets download/eval steps run even if training times out.
      - name: Run training and download results
        timeout-minutes: 240
        continue-on-error: true
        run: |
          {
            echo "import sys; sys.argv = ['colab_train.py', '--epochs', '${{ inputs.epochs }}', '--bev_pos_weight', '${{ inputs.bev_pos_weight }}', '--max_frames', '${{ inputs.max_frames }}', '--loss_type', '${{ inputs.loss_type }}', '--offset_weight', '${{ inputs.offset_weight }}', '--fusion_mode', '${{ inputs.fusion_mode }}']"
            cat scripts/colab_train.py
          } | colab exec -s bev-train --timeout 7200 > train_exec.log 2>&1 &
          EXEC_PID=$!

          tail -f train_exec.log &
          TAIL_PID=$!

          # 训练期间周期性下载最新 checkpoint（验证见 PR #80: colab download 可与
          # colab exec 并发调用，10/10 成功）。即使 session 在脚本结束瞬间失联，
          # 也最多损失一次轮询间隔（3分钟）内的训练进度。
          REMOTE="/content/BEV_Track-Predict/outputs"
          while kill -0 $EXEC_PID 2>/dev/null; do
            sleep 180
            colab download -s bev-train "$REMOTE/train_multicam_mvdet_style_v3/model_final.pth" ./model_final.pth || true
            colab download -s bev-train "$REMOTE/eval_results.json" ./eval_results.json || true
          done

          wait $EXEC_PID
          EXEC_RET=$?
          kill $TAIL_PID 2>/dev/null || true

          # 训练结束后的最终尝试（可能拿到最新结果；若失败，已有周期性备份兜底）
          colab download -s bev-train "$REMOTE/eval_results.json"                                     ./eval_results.json   || true
          colab download -s bev-train "$REMOTE/train_multicam_mvdet_style_v3/model_final.pth"         ./model_final.pth     || true
          colab download -s bev-train "$REMOTE/train_multicam_mvdet_style_v3/metrics.csv"             ./metrics.csv         || true
          colab download -s bev-train "$REMOTE/visualization/bev_prediction.png"                      ./bev_prediction.png  || true
          colab download -s bev-train "$REMOTE/visualization/bev_overlay.png"                         ./bev_overlay.png     || true

          exit $EXEC_RET

      - name: Print evaluation summary
        if: always()
        run: |
          if [ -f eval_results.json ]; then
            python3 -c "
          import json
          r = json.load(open('eval_results.json'))
          print('=' * 50)
          print('EVALUATION RESULTS')
          print('=' * 50)
          if 'det_moda' in r:
              print(f'{\"MODA\":20s}: {r[\"det_moda\"]:.4f}')
              print(f'{\"MODP\":20s}: {r[\"det_modp\"]:.4f}')
              print(f'{\"Precision\":20s}: {r[\"det_precision\"]:.4f}')
              print(f'{\"Recall\":20s}: {r[\"det_recall\"]:.4f}')
              print(f'{\"F1\":20s}: {r[\"det_f1\"]:.4f}')
              print(f'{\"Best Threshold\":20s}: {r[\"det_best_threshold\"]:.2f}')
              print(f'{\"TP/FP/FN\":20s}: {int(r[\"det_moda_tp\"])}/{int(r[\"det_moda_fp\"])}/{int(r[\"det_moda_fn\"])}')
          print('=' * 50)
          "
          else
            echo "[WARN] eval_results.json not found — evaluation may have failed"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bev-checkpoint-run${{ github.run_number }}
          path: |
            model_final.pth
            metrics.csv
            eval_results.json
            bev_prediction.png
            bev_overlay.png
          if-no-files-found: warn

      - name: Stop Colab session
        if: always()
        run: colab stop -s bev-train || true
