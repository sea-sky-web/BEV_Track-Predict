name: Colab Training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: '训练轮数'
        default: '10'
        required: false
      gpu:
        description: 'GPU 型号（T4 / L4 / A100）'
        default: 'T4'
        required: false
      bev_pos_weight:
        description: 'BEV 正样本损失权重（抬高行人响应）'
        default: '10.0'
        required: false
      max_frames:
        description: '训练帧数上限（更多帧 = 更多数据 = 更好泛化）'
        default: '100'
        required: false
      checkpoint_run:
        description: 'eval-only: 从指定 run number 下载 checkpoint（配合 epochs=0）'
        default: ''
        required: false

jobs:
  train:
    name: Train on Colab ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install google-colab-cli

      - name: Restore Colab credentials
        env:
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          token = os.environ["COLAB_REFRESH_TOKEN"].strip()
          assert token, "COLAB_REFRESH_TOKEN is empty"
          creds = {
              "token": None,
              "refresh_token": token,
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": "764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com",
              "client_secret": "d-FL95Q19q7MQmFpd7hHD0Ty",
              "scopes": [
                  "openid",
                  "https://www.googleapis.com/auth/userinfo.profile",
                  "https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory",
                  "https://www.googleapis.com/auth/drive.file"
              ],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": None
          }
          path = os.path.expanduser("~/.config/colab-cli/token.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(creds, f)
          print("[OK] token.json constructed from refresh_token")
          EOF

      - name: Kill stale sessions and create session
        run: |
          # Kill any existing session (may fail silently if none exists)
          colab stop -s bev-train 2>/dev/null || true
          sleep 15
          # Retry colab new up to 3 times with kill between attempts
          for attempt in 1 2 3; do
            echo "=== Create session attempt $attempt ==="
            colab new --gpu ${{ inputs.gpu }} --session bev-train && break
            echo "Attempt $attempt failed, killing stale and retrying in 30s..."
            colab stop -s bev-train 2>/dev/null || true
            sleep 30
          done

      - name: Upload checkpoint for eval-only
        if: inputs.checkpoint_run != '' && inputs.epochs == '0'
        run: |
          echo "Downloading checkpoint from run ${{ inputs.checkpoint_run }}..."
          gh run download ${{ inputs.checkpoint_run }} -n bev-checkpoint-run${{ inputs.checkpoint_run }} -D /tmp/ckpt 2>&1 || true
          CKPT=$(find /tmp/ckpt -name 'model_final.pth' | head -1)
          if [ -z "$CKPT" ]; then
            echo "[ERROR] model_final.pth not found in run ${{ inputs.checkpoint_run }} artifacts"
            exit 1
          fi
          echo "Found checkpoint: $CKPT ($(du -h "$CKPT" | cut -f1))"
          REMOTE="/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3"
          colab exec -s bev-train "import os; os.makedirs('$REMOTE', exist_ok=True)"
          colab upload -s bev-train "$CKPT" "$REMOTE/model_final.pth"
          echo "[OK] Checkpoint uploaded to Colab"
        env:
          GH_TOKEN: ${{ github.token }}

      # colab exec --timeout is inactivity timeout. Set high (7200s=2h) so long training
      # doesn't disconnect. The step-level timeout-minutes=240 is the hard wall.
      # continue-on-error lets download/eval steps run even if training times out.
      - name: Run training
        timeout-minutes: 240
        continue-on-error: true
        run: |
          {
            echo "import sys; sys.argv = ['colab_train.py', '--epochs', '${{ inputs.epochs }}', '--bev_pos_weight', '${{ inputs.bev_pos_weight }}', '--max_frames', '${{ inputs.max_frames }}']"
            cat scripts/colab_train.py
          } | colab exec -s bev-train --timeout 7200

      - name: Download checkpoint
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3"
          colab download -s bev-train "$REMOTE/model_final.pth" ./model_final.pth || true
          colab download -s bev-train "$REMOTE/metrics.csv"    ./metrics.csv      || true

      - name: Run evaluation + visualization (single session)
        if: always()
        timeout-minutes: 25
        continue-on-error: true
        run: |
          colab exec -s bev-train --timeout 1200 <<'EVALVIZ'
          import subprocess, sys, json, pathlib

          # --- Evaluation ---
          eval_cmd = (
              "cd /content/BEV_Track-Predict && "
              "python3 src/evaluate_main.py "
              "--data_root /content/BEV_Track-Predict/wildtrack "
              "--model_path outputs/train_multicam_mvdet_style_v3/model_final.pth "
              "--device cuda "
              "--report_detection "
              "--metrics_out outputs/eval_results.json "
              "--views 0,1,2,3,4,5,6"
          )
          print(f">>> {eval_cmd}", flush=True)
          ret = subprocess.call(eval_cmd, shell=True)
          print(f"\n[EVAL] exit code: {ret}", flush=True)

          # --- Inline eval results (captured by GA logs even if download fails) ---
          p = pathlib.Path('/content/BEV_Track-Predict/outputs/eval_results.json')
          if p.exists():
              r = json.loads(p.read_text())
              print('\n=== EVAL RESULTS (inline) ===')
              for k in ['det_moda','det_modp','det_precision','det_recall','det_f1',
                        'det_best_threshold','det_moda_tp','det_moda_fp','det_moda_fn']:
                  print(f'{k}: {r.get(k, "N/A")}')
              print('=== END EVAL RESULTS ===', flush=True)
          else:
              print('[WARN] eval_results.json not found after eval', flush=True)

          # --- Visualization (same session, before it dies) ---
          viz_cmd = (
              "cd /content/BEV_Track-Predict && "
              "python3 scripts/visualize_prediction.py "
              "--model_path outputs/train_multicam_mvdet_style_v3/model_final.pth "
              "--data_root /content/BEV_Track-Predict/wildtrack "
              "--output outputs/visualization "
              "--frame 0"
          )
          print(f"\n>>> {viz_cmd}", flush=True)
          ret2 = subprocess.call(viz_cmd, shell=True)
          print(f"[VIZ] exit code: {ret2}", flush=True)
          EVALVIZ

      - name: Download evaluation results
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs"
          colab download -s bev-train "$REMOTE/eval_results.json" ./eval_results.json || true

      - name: Print evaluation summary
        if: always()
        run: |
          if [ -f eval_results.json ]; then
            python3 -c "
          import json
          r = json.load(open('eval_results.json'))
          print('=' * 50)
          print('EVALUATION RESULTS')
          print('=' * 50)
          for k in ['loss','pos_mse','aux_pos_mse']:
              print(f'{k:20s}: {r.get(k, \"N/A\"):.6f}' if isinstance(r.get(k), (int,float)) else f'{k:20s}: N/A')
          if 'det_moda' in r:
              print('-' * 50)
              print(f'{\"MODA\":20s}: {r[\"det_moda\"]:.4f}')
              print(f'{\"MODP\":20s}: {r[\"det_modp\"]:.4f}')
              print(f'{\"Precision\":20s}: {r[\"det_precision\"]:.4f}')
              print(f'{\"Recall\":20s}: {r[\"det_recall\"]:.4f}')
              print(f'{\"F1\":20s}: {r[\"det_f1\"]:.4f}')
              print(f'{\"Best Threshold\":20s}: {r[\"det_best_threshold\"]:.2f}')
              print(f'{\"TP/FP/FN\":20s}: {int(r[\"det_moda_tp\"])}/{int(r[\"det_moda_fp\"])}/{int(r[\"det_moda_fn\"])}')
          print('=' * 50)
          "
          else
            echo "[WARN] eval_results.json not found — evaluation may have failed"
          fi

      - name: Download visualization
        if: always()
        run: |
          VIZ_REMOTE="/content/BEV_Track-Predict/outputs/visualization"
          colab download -s bev-train "$VIZ_REMOTE/bev_prediction.png" ./bev_prediction.png || true
          colab download -s bev-train "$VIZ_REMOTE/bev_overlay.png"    ./bev_overlay.png    || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bev-checkpoint-run${{ github.run_number }}
          path: |
            model_final.pth
            metrics.csv
            eval_results.json
            bev_prediction.png
            bev_overlay.png
          if-no-files-found: warn

      - name: Stop Colab session
        if: always()
        run: colab stop -s bev-train || true
