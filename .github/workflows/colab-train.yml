name: Colab Training

on:
  workflow_dispatch:
    inputs:
      data_zip:
        description: 'Drive 中 wildtrack.zip 的路径（相对于 MyDrive）'
        default: 'Colab_Notebooks/dataSet/wildtrack.zip'
        required: false
      epochs:
        description: '训练轮数'
        default: '10'
        required: false
      gpu:
        description: 'GPU 型号（T4 / L4 / A100）'
        default: 'T4'
        required: false

jobs:
  train:
    name: Train on Colab ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install google-colab-cli

      - name: Restore Colab credentials
        env:
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          token = os.environ["COLAB_REFRESH_TOKEN"].strip()
          assert token, "COLAB_REFRESH_TOKEN is empty"
          creds = {
              "token": None,
              "refresh_token": token,
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": "764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com",
              "client_secret": "d-FL95Q19q7MQmFpd7hHD0Ty",
              "scopes": [
                  "openid",
                  "https://www.googleapis.com/auth/userinfo.profile",
                  "https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory",
                  "https://www.googleapis.com/auth/drive.file"
              ],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": None
          }
          path = os.path.expanduser("~/.config/colab-cli/token.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(creds, f)
          print("[OK] token.json constructed from refresh_token")
          EOF

      # 拆分为 new → drivemount → exec 三步，因为 drive.mount() 在 exec 内不可用
      - name: Create Colab session
        run: colab new --gpu ${{ inputs.gpu }} --session bev-train

      - name: Mount Google Drive
        run: colab drivemount -s bev-train /content/drive

      # 调试：查看 Drive 目录结构，确认 zip 路径
      - name: List Drive contents
        run: |
          echo "ls /content/drive/MyDrive/" | colab exec -s bev-train --timeout 30 || true
          echo "import os; [print(os.path.join(dp,f)) for dp,_,fn in os.walk('/content/drive/MyDrive/') for f in fn if 'wildtrack' in f.lower() or 'wild' in f.lower()][:20]" | colab exec -s bev-train --timeout 30 || true

      # colab exec -f 不支持传参给脚本，用 stdin 注入变量后执行
      - name: Run training
        run: |
          {
            echo "import sys; sys.argv = ['colab_train.py', '--data_zip', '/content/drive/MyDrive/${{ inputs.data_zip }}', '--epochs', '${{ inputs.epochs }}']"
            cat scripts/colab_train.py
          } | colab exec -s bev-train --timeout 18000

      - name: Download checkpoint
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3"
          colab download -s bev-train "$REMOTE/model_final.pth" ./model_final.pth || true
          colab download -s bev-train "$REMOTE/metrics.csv"    ./metrics.csv      || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bev-checkpoint-run${{ github.run_number }}
          path: |
            model_final.pth
            metrics.csv
          if-no-files-found: warn

      - name: Stop Colab session
        if: always()
        run: colab stop -s bev-train || true
