name: Colab Training

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: '训练轮数'
        default: '10'
        required: false
      gpu:
        description: 'GPU 型号（T4 / L4 / A100）'
        default: 'T4'
        required: false

jobs:
  train:
    name: Train on Colab ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install google-colab-cli

      - name: Restore Colab credentials
        env:
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          token = os.environ["COLAB_REFRESH_TOKEN"].strip()
          assert token, "COLAB_REFRESH_TOKEN is empty"
          creds = {
              "token": None,
              "refresh_token": token,
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": "764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com",
              "client_secret": "d-FL95Q19q7MQmFpd7hHD0Ty",
              "scopes": [
                  "openid",
                  "https://www.googleapis.com/auth/userinfo.profile",
                  "https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory",
                  "https://www.googleapis.com/auth/drive.file"
              ],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": None
          }
          path = os.path.expanduser("~/.config/colab-cli/token.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(creds, f)
          print("[OK] token.json constructed from refresh_token")
          EOF

      - name: Create Colab session
        run: colab new --gpu ${{ inputs.gpu }} --session bev-train

      # 1) 环境准备：clone、下载数据、安装依赖（短命令，不怕断连）
      - name: Setup environment on Colab
        run: |
          colab exec -s bev-train --timeout 600 <<'SETUP'
          import subprocess, os
          def run(cmd):
              print(f">>> {cmd}", flush=True)
              subprocess.check_call(cmd, shell=True)
          run("git clone https://github.com/sea-sky-web/BEV_Track-Predict.git /content/BEV_Track-Predict || (cd /content/BEV_Track-Predict && git pull)")
          run("pip install -q gdown")
          if not os.path.exists("/content/BEV_Track-Predict/wildtrack/Image_subsets"):
              run("gdown 1LDNFgAEq9wYWkbOPk4UdXQetBkhZSVfy -O /tmp/wildtrack.zip")
              run("unzip -q -o /tmp/wildtrack.zip -d /content/BEV_Track-Predict/")
          run("pip install -q -r /content/BEV_Track-Predict/requirements.txt 2>/dev/null || pip install -q torch torchvision numpy opencv-python-headless scipy")
          print("[OK] Environment ready", flush=True)
          SETUP

      # 2) 后台启动训练（nohup），避免 WebSocket 长连接断开
      - name: Start training (background)
        run: |
          colab exec -s bev-train --timeout 120 <<TRAIN
          import subprocess
          cmd = (
              "cd /content/BEV_Track-Predict && "
              "PYTHONUNBUFFERED=1 nohup python3 scripts/train_main.py "
              "--data_root /content/BEV_Track-Predict/wildtrack "
              "--views 0,1,2,3,4,5,6 --max_frames -1 "
              "--epochs ${{ inputs.epochs }} --batch 1 --pretrained true "
              "--backbone resnet18 --fusion_mode confidence_v2 "
              "--augment true --augment_hflip_prob 0.0 "
              "--augment_color_jitter 0.2,0.2,0.2,0.05 "
              "--alpha 1.0 --optimizer adam --scheduler cosine "
              "--lr_init 0.0001 --weight_decay 0.0001 "
              "--freeze_backbone_epochs 3 --device cuda --log_every 20 "
              "> /content/train.log 2>&1 &"
          )
          print(f">>> {cmd}", flush=True)
          subprocess.Popen(cmd, shell=True)
          import time; time.sleep(2)
          subprocess.check_call("ps aux | grep train_main | grep -v grep || echo 'WARNING: process not found'", shell=True)
          print("[OK] Training started in background", flush=True)
          TRAIN

      # 3) 轮询等待训练完成（每60秒检查一次）
      - name: Wait for training
        run: |
          echo "Polling for training completion..."
          for i in $(seq 1 60); do
            sleep 60
            # 检查 model_final.pth 是否生成
            DONE=$(colab exec -s bev-train --timeout 30 <<'CHECK' 2>&1 || true
          import os
          log = "/content/train.log"
          final = "/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3/model_final.pth"
          if os.path.exists(final):
              print("TRAINING_DONE")
          elif os.path.exists(log):
              lines = open(log).readlines()
              for l in lines[-5:]:
                  print(l.rstrip())
          else:
              print("Waiting for log file...")
          CHECK
            )
            echo "[Poll $i/60] $DONE"
            if echo "$DONE" | grep -q "TRAINING_DONE"; then
              echo "Training completed!"
              # 打印完整日志
              colab exec -s bev-train --timeout 60 <<'LOG' || true
          with open("/content/train.log") as f:
              print(f.read())
          LOG
              break
            fi
          done

      - name: Download checkpoint
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3"
          colab download -s bev-train "$REMOTE/model_final.pth" ./model_final.pth || true
          colab download -s bev-train "$REMOTE/metrics.csv"    ./metrics.csv      || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bev-checkpoint-run${{ github.run_number }}
          path: |
            model_final.pth
            metrics.csv
          if-no-files-found: warn

      - name: Stop Colab session
        if: always()
        run: colab stop -s bev-train || true
