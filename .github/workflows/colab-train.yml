name: Colab Training

on:
  workflow_dispatch:
    inputs:
      drive_path:
        description: 'Wildtrack 在 Google Drive MyDrive 下的路径（相对）'
        default: 'wildtrack'
        required: false
      epochs:
        description: '训练轮数'
        default: '10'
        required: false
      gpu:
        description: 'GPU 型号（T4 / L4 / A100）'
        default: 'T4'
        required: false

jobs:
  train:
    name: Train on Colab ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install google-colab-cli

      # 用环境变量传递 Secret，避免 shell 对 JSON 中特殊字符的转义问题
      - name: Restore Colab credentials
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_TOKEN_JSON" > ~/.config/colab-cli/token.json
          # 验证写入是否有效
          python3 - <<'EOF'
          import json, sys, os
          try:
              with open(os.path.expanduser("~/.config/colab-cli/token.json")) as f:
                  d = json.load(f)
              assert d.get("refresh_token"), "refresh_token missing"
              print(f"[OK] token.json loaded, refresh_token present")
          except Exception as e:
              print(f"[ERROR] token.json invalid: {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Run training on Colab
        run: |
          colab run \
            --gpu ${{ inputs.gpu }} \
            --keep \
            --session bev-train \
            --timeout 18000 \
            scripts/colab_train.py \
            --data_root /content/drive/MyDrive/${{ inputs.drive_path }} \
            --epochs ${{ inputs.epochs }}

      - name: Download checkpoint
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3"
          colab download -s bev-train "$REMOTE/model_final.pth" ./model_final.pth || true
          colab download -s bev-train "$REMOTE/metrics.csv"    ./metrics.csv      || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bev-checkpoint-run${{ github.run_number }}
          path: |
            model_final.pth
            metrics.csv
          if-no-files-found: warn

      - name: Stop Colab session
        if: always()
        run: colab stop -s bev-train || true
