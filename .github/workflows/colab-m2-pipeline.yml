name: Module 2 Pipeline

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: 'GPU 型号（T4 / L4 / A100）'
        default: 'T4'
        required: false
      seed:
        description: '随机种子'
        default: '0'
        required: false
      skip_training:
        description: '跳过 ConvLSTM 训练（仅运行 tracking + baselines）'
        default: 'false'
        required: false
      bev_down:
        description: 'BEV 网格降采样倍数 (4=0.1m, 8=0.2m, 16=0.4m)'
        default: '4'
        required: false
      train_run_id:
        description: '训练 run ID（下载 M1 checkpoint，启用 Level 2&3 评估）'
        default: ''
        required: false

jobs:
  pipeline:
    name: M2 Pipeline on Colab ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install google-colab-cli

      - name: Restore Colab credentials
        env:
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          token = os.environ["COLAB_REFRESH_TOKEN"].strip()
          assert token, "COLAB_REFRESH_TOKEN is empty"
          creds = {
              "token": None,
              "refresh_token": token,
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": "764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com",
              "client_secret": "d-FL95Q19q7MQmFpd7hHD0Ty",
              "scopes": [
                  "openid",
                  "https://www.googleapis.com/auth/userinfo.profile",
                  "https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory",
                  "https://www.googleapis.com/auth/drive.file"
              ],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": None
          }
          path = os.path.expanduser("~/.config/colab-cli/token.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(creds, f)
          print("[OK] token.json constructed from refresh_token")
          EOF

      - name: Create Colab session
        run: |
          colab stop -s bev-m2 2>/dev/null || true
          sleep 15
          for attempt in 1 2 3; do
            echo "=== Create session attempt $attempt ==="
            colab new --gpu ${{ inputs.gpu }} --session bev-m2 && break
            echo "Attempt $attempt failed, retrying in 30s..."
            colab stop -s bev-m2 2>/dev/null || true
            sleep 30
          done

      - name: Download M1 checkpoint (for Level 2&3)
        if: inputs.train_run_id != ''
        run: |
          echo "Downloading M1 checkpoint from run ${{ inputs.train_run_id }}..."
          gh run download ${{ inputs.train_run_id }} -D /tmp/m1_ckpt --repo ${{ github.repository }} 2>&1 || true
          CKPT=$(find /tmp/m1_ckpt -name 'model_final.pth' -type f 2>/dev/null | head -1)
          if [ -n "$CKPT" ]; then
            cp "$CKPT" ./model_final.pth
            echo "[OK] M1 checkpoint downloaded ($(du -h ./model_final.pth | cut -f1))"
          else
            echo "[WARN] model_final.pth not found, Level 2&3 will be skipped"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload M1 checkpoint to Colab
        if: inputs.train_run_id != ''
        run: |
          if [ ! -f model_final.pth ]; then
            echo "[SKIP] No checkpoint to upload"
            exit 0
          fi
          REMOTE="/content/BEV_Track-Predict/outputs/frozen_detector"
          echo "import os; os.makedirs('$REMOTE', exist_ok=True)" | colab exec -s bev-m2

          CHUNK_DIR=/tmp/m1_chunks
          mkdir -p "$CHUNK_DIR"
          split -b 8m ./model_final.pth "$CHUNK_DIR/chunk_"
          echo "import os; os.makedirs('$REMOTE/_chunks', exist_ok=True)" | colab exec -s bev-m2

          for part in "$CHUNK_DIR"/chunk_*; do
            name=$(basename "$part")
            for attempt in 1 2 3; do
              colab upload -s bev-m2 "$part" "$REMOTE/_chunks/$name" && break
              sleep 10
            done
          done

          echo "import glob, shutil
          parts = sorted(glob.glob('$REMOTE/_chunks/chunk_*'))
          with open('$REMOTE/model_final.pth', 'wb') as out:
              for p in parts:
                  with open(p, 'rb') as f:
                      shutil.copyfileobj(f, out)
          shutil.rmtree('$REMOTE/_chunks')
          import os; print(f'[OK] Reassembled {len(parts)} chunks, {os.path.getsize(\"$REMOTE/model_final.pth\")/1e6:.1f} MB')
          " | colab exec -s bev-m2
          echo "[OK] M1 checkpoint uploaded"

      - name: Run M2 pipeline
        timeout-minutes: 150
        run: |
          SKIP_FLAG=""
          if [ "${{ inputs.skip_training }}" == "true" ]; then
            SKIP_FLAG="--skip_training"
          fi

          cat > /tmp/m2_launcher.py <<'PYEOF'
          import os, sys, subprocess, shutil
          from pathlib import Path

          REPO_URL = "https://github.com/sea-sky-web/BEV_Track-Predict.git"
          REPO_DIR = Path("/content/BEV_Track-Predict")
          GDRIVE_FOLDER_ID = "1uBptJBbtMzVRQwSMRbQkIJp8-VVoBqUK"

          def run(cmd, cwd=None, check=True):
              if isinstance(cmd, str): cmd = cmd.split()
              print(f"\n>>> {' '.join(str(c) for c in cmd)}", flush=True)
              env = os.environ.copy()
              env["PYTHONUNBUFFERED"] = "1"
              proc = subprocess.Popen(cmd, cwd=cwd, env=env, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, text=True, bufsize=1)
              for line in proc.stdout: print(line, end="", flush=True)
              proc.wait()
              if check and proc.returncode != 0:
                  raise subprocess.CalledProcessError(proc.returncode, cmd)
              return proc.returncode

          # Clone / pull
          if REPO_DIR.exists() and (REPO_DIR / ".git").exists():
              run(["git", "-C", str(REPO_DIR), "pull", "--ff-only"], check=False)
          else:
              if REPO_DIR.exists(): shutil.rmtree(str(REPO_DIR))
              run(["git", "clone", REPO_URL, str(REPO_DIR)])

          # Download dataset
          data_root = REPO_DIR / "wildtrack"
          if not (data_root / "annotations_positions").exists():
              run([sys.executable, "-m", "pip", "install", "-q", "gdown==5.2.0"])
              run([sys.executable, "-m", "gdown", "--folder", "--fuzzy", "--remaining-ok",
                   f"https://drive.google.com/drive/folders/{GDRIVE_FOLDER_ID}",
                   "-O", str(REPO_DIR)], check=False)
              zip_path = REPO_DIR / "wildtrack.zip"
              if zip_path.exists():
                  run(["unzip", "-q", str(zip_path), "-d", str(REPO_DIR)])
                  zip_path.unlink()
              found = list(REPO_DIR.rglob("annotations_positions"))
              if not found:
                  print("[ERROR] annotations_positions not found"); sys.exit(1)
              actual = found[0].parent
              if actual != data_root:
                  if data_root.exists(): shutil.rmtree(str(data_root))
                  actual.rename(data_root)
              print(f"[OK] Data ready: {data_root}")

          # Install deps
          run([sys.executable, "-m", "pip", "install", "-q", "-r",
               str(REPO_DIR / "requirements.txt")], check=False)

          # Export M1 detections if checkpoint exists
          ckpt_path = REPO_DIR / "outputs" / "frozen_detector" / "model_final.pth"
          jsonl_path = REPO_DIR / "outputs" / "frozen_detector" / "detections.jsonl"
          det_flag = []
          if ckpt_path.exists():
              print(f"\n[M1] Exporting detections from {ckpt_path}...")
              export_cmd = [
                  sys.executable, str(REPO_DIR / "scripts" / "export_detections_jsonl.py"),
                  "--data_root", str(data_root),
                  "--model_path", str(ckpt_path),
                  "--output", str(jsonl_path),
                  "--device", "cuda",
                  "--backbone", "mobilenet_v2",
                  "--fusion_mode", "geo_confidence_v1",
                  "--frame_start", "0",
                  "--max_frames", "400",
              ]
              ret = run(export_cmd, cwd=str(REPO_DIR), check=False)
              if ret == 0 and jsonl_path.exists():
                  print(f"[OK] Detections exported: {jsonl_path}")
                  det_flag = ["--detections_jsonl", str(jsonl_path)]
              else:
                  print("[WARN] Detection export failed, running Level 1 only")
          else:
              print("[INFO] No M1 checkpoint found, running Level 1 only")

          # Run pipeline
          cmd = [sys.executable, str(REPO_DIR / "scripts" / "run_m2_pipeline.py"),
                 "--annotations_dir", str(data_root / "annotations_positions"),
                 "--output_dir", str(REPO_DIR / "outputs" / "m2_pipeline"),
                 "--device", "cuda",
                 "--seed", "PLACEHOLDER_SEED",
                 "--bev_down", "PLACEHOLDER_BEV_DOWN"]
          cmd.extend(det_flag)
          if "PLACEHOLDER_SKIP" == "true":
              cmd.append("--skip_training")
          run(cmd, cwd=str(REPO_DIR))
          print("[OK] Pipeline complete", flush=True)
          PYEOF

          # Inject actual values into the launcher script (env vars don't pass through colab exec)
          sed -i "s/PLACEHOLDER_SEED/${{ inputs.seed }}/g" /tmp/m2_launcher.py
          sed -i "s/PLACEHOLDER_BEV_DOWN/${{ inputs.bev_down }}/g" /tmp/m2_launcher.py
          sed -i "s/PLACEHOLDER_SKIP/${{ inputs.skip_training }}/g" /tmp/m2_launcher.py

          colab exec -s bev-m2 --timeout 7200 < /tmp/m2_launcher.py

      - name: Download results
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs/m2_pipeline"
          colab download -s bev-m2 "$REMOTE/m2_pipeline_results.json" ./m2_pipeline_results.json || true
          colab download -s bev-m2 "$REMOTE/convlstm_seed${{ inputs.seed }}/best_model.pth" ./best_model.pth || true
          colab download -s bev-m2 "$REMOTE/convlstm_seed${{ inputs.seed }}/metrics.json" ./convlstm_metrics.json || true

      - name: Print results
        if: always()
        run: |
          if [ -f m2_pipeline_results.json ]; then
            python3 -c "
          import json
          r = json.load(open('m2_pipeline_results.json'))
          print('=' * 50)
          print('MODULE 2 PIPELINE RESULTS')
          print('=' * 50)
          for level in ['L1', 'L2', 'L3']:
              tk = f'{level}_tracking'
              if tk in r and 'kalman' in r[tk]:
                  m = r[tk]['kalman']
                  print(f'{level} Tracking: MOTA={m[\"mota\"]:.4f} IDF1={m[\"idf1\"]:.4f} IDSW={m[\"id_switches\"]}')
          print()
          for level in ['L1', 'L2', 'L3']:
              bk = f'{level}_baselines'
              if bk in r and 'persistence' in r[bk]:
                  m = r[bk]['persistence']
                  print(f'{level} Baseline (persistence): AUPRC={m[\"occ_auprc_mean\"]:.4f}')
          if 'L1_convlstm' in r and 'best_auprc' in r.get('L1_convlstm', {}):
              print(f'\nConvLSTM best val AUPRC: {r[\"L1_convlstm\"][\"best_auprc\"]:.4f}')
          print('=' * 50)
          "
          else
            echo "[ERROR] m2_pipeline_results.json not found"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-pipeline-run${{ github.run_number }}
          path: |
            m2_pipeline_results.json
            best_model.pth
            convlstm_metrics.json
          if-no-files-found: warn

      - name: Stop Colab session
        if: always()
        run: colab stop -s bev-m2 || true
