name: Test Concurrent Download

on:
  workflow_dispatch:

jobs:
  test:
    name: Verify colab download works during colab exec
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install google-colab-cli

      - name: Restore Colab credentials
        env:
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          token = os.environ["COLAB_REFRESH_TOKEN"].strip()
          assert token, "COLAB_REFRESH_TOKEN is empty"
          creds = {
              "token": None,
              "refresh_token": token,
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": "764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com",
              "client_secret": "d-FL95Q19q7MQmFpd7hHD0Ty",
              "scopes": [
                  "openid",
                  "https://www.googleapis.com/auth/userinfo.profile",
                  "https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory",
                  "https://www.googleapis.com/auth/drive.file"
              ],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": None
          }
          path = os.path.expanduser("~/.config/colab-cli/token.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(creds, f)
          print("[OK] token.json constructed from refresh_token")
          EOF

      - name: Create CPU session
        run: |
          colab stop -s dl-test 2>/dev/null || true
          sleep 10
          colab new --session dl-test

      - name: Run fake training + concurrent download test
        timeout-minutes: 10
        continue-on-error: true
        run: |
          mkdir -p /tmp/dl_results
          {
            echo "import sys; sys.argv = ['fake_training_sim.py', '--duration', '180', '--interval', '15']"
            cat scripts/fake_training_sim.py
          } | colab exec -s dl-test --timeout 300 > exec.log 2>&1 &
          EXEC_PID=$!
          echo "[TEST] exec started, PID=$EXEC_PID"

          tail -f exec.log &
          TAIL_PID=$!

          ATTEMPT=0
          while kill -0 $EXEC_PID 2>/dev/null; do
            sleep 20
            ATTEMPT=$((ATTEMPT+1))
            echo "[TEST] concurrent download attempt #$ATTEMPT (exec still running)"
            if colab download -s dl-test "/content/fake_outputs/model_final.pth" "/tmp/dl_results/attempt_${ATTEMPT}.pth"; then
              echo "[TEST] attempt #$ATTEMPT: SUCCESS ($(du -h /tmp/dl_results/attempt_${ATTEMPT}.pth | cut -f1))"
            else
              echo "[TEST] attempt #$ATTEMPT: FAILED"
            fi
          done

          wait $EXEC_PID
          EXEC_RET=$?
          kill $TAIL_PID 2>/dev/null || true
          echo "[TEST] exec finished with exit code $EXEC_RET"

          echo "[TEST] === Summary ==="
          echo "[TEST] Total concurrent download attempts: $ATTEMPT"
          ls -la /tmp/dl_results/ || echo "[TEST] no files downloaded"
          SUCCESS_COUNT=$(ls /tmp/dl_results/*.pth 2>/dev/null | wc -l)
          echo "[TEST] Successful downloads: $SUCCESS_COUNT / $ATTEMPT"

      - name: Stop session
        if: always()
        run: colab stop -s dl-test || true
