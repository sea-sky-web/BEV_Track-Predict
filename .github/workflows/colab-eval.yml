name: Colab Evaluation

on:
  workflow_dispatch:
    inputs:
      train_run_id:
        description: '训练 run ID（下载 model_final.pth artifact）'
        required: true
      gpu:
        description: 'GPU 型号（T4 / L4 / A100）'
        default: 'T4'
        required: false
      fusion_mode:
        description: 'BEV 融合模式'
        default: 'geo_confidence_v1'
        required: false
      backbone:
        description: 'Backbone 网络'
        default: 'mobilenet_v2'
        required: false

jobs:
  eval:
    name: Evaluate on Colab ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install colab-cli
        run: pip install 'google-colab-cli' 'jupyter-kernel-client<1.0.0'

      - name: Restore Colab credentials
        env:
          COLAB_REFRESH_TOKEN: ${{ secrets.COLAB_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os
          token = os.environ["COLAB_REFRESH_TOKEN"].strip()
          assert token, "COLAB_REFRESH_TOKEN is empty"
          creds = {
              "token": None,
              "refresh_token": token,
              "token_uri": "https://oauth2.googleapis.com/token",
              "client_id": "764086051850-6qr4p6gpi6hn506pt8ejuq83di341hur.apps.googleusercontent.com",
              "client_secret": "d-FL95Q19q7MQmFpd7hHD0Ty",
              "scopes": [
                  "openid",
                  "https://www.googleapis.com/auth/userinfo.profile",
                  "https://www.googleapis.com/auth/userinfo.email",
                  "https://www.googleapis.com/auth/cloud-platform",
                  "https://www.googleapis.com/auth/colaboratory",
                  "https://www.googleapis.com/auth/drive.file"
              ],
              "universe_domain": "googleapis.com",
              "account": "",
              "expiry": None
          }
          path = os.path.expanduser("~/.config/colab-cli/token.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(creds, f)
          print("[OK] token.json constructed from refresh_token")
          EOF

      - name: Download training artifact
        id: download_model
        run: |
          echo "Downloading checkpoint from run ${{ inputs.train_run_id }}..."
          gh run download ${{ inputs.train_run_id }} -D /tmp/ckpt --repo ${{ github.repository }} 2>&1 || true
          CKPT=$(find /tmp/ckpt -name 'model_final.pth' -type f 2>/dev/null | head -1)
          if [ -n "$CKPT" ]; then
            cp "$CKPT" ./model_final.pth
            echo "found=true" >> $GITHUB_OUTPUT
            echo "[OK] model_final.pth downloaded ($(du -h ./model_final.pth | cut -f1))"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "[ERROR] model_final.pth not found in run ${{ inputs.train_run_id }} artifacts"
            echo "Available artifacts:"
            find /tmp/ckpt -type f 2>/dev/null || echo "(none)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Kill stale sessions and create session
        run: |
          colab stop -s bev-eval 2>/dev/null || true
          sleep 15
          for attempt in 1 2 3; do
            echo "=== Create session attempt $attempt ==="
            colab new --gpu ${{ inputs.gpu }} --session bev-eval && break
            echo "Attempt $attempt failed, retrying in 30s..."
            colab stop -s bev-eval 2>/dev/null || true
            sleep 30
          done

      - name: Upload model to Colab
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs/train_multicam_mvdet_style_v3"
          echo "import os; os.makedirs('$REMOTE', exist_ok=True)" | colab exec -s bev-eval

          # Split into chunks to avoid SSLEOFError on large uploads
          CHUNK_DIR=/tmp/ckpt_chunks
          mkdir -p "$CHUNK_DIR"
          split -b 8m ./model_final.pth "$CHUNK_DIR/chunk_"
          echo "import os; os.makedirs('$REMOTE/_chunks', exist_ok=True)" | colab exec -s bev-eval

          for part in "$CHUNK_DIR"/chunk_*; do
            name=$(basename "$part")
            for attempt in 1 2 3; do
              echo "=== Upload $name attempt $attempt ==="
              colab upload -s bev-eval "$part" "$REMOTE/_chunks/$name" && break
              if [ "$attempt" -eq 3 ]; then
                echo "[ERROR] Checkpoint chunk $name failed after 3 attempts"
                exit 1
              fi
              sleep 10
            done
          done

          echo "import glob, shutil
          parts = sorted(glob.glob('$REMOTE/_chunks/chunk_*'))
          with open('$REMOTE/model_final.pth', 'wb') as out:
              for p in parts:
                  with open(p, 'rb') as f:
                      shutil.copyfileobj(f, out)
          shutil.rmtree('$REMOTE/_chunks')
          import os
          size = os.path.getsize('$REMOTE/model_final.pth')
          print(f'[OK] Reassembled {len(parts)} chunks, total {size/1e6:.1f} MB')
          " | colab exec -s bev-eval
          echo "[OK] Checkpoint uploaded to Colab"

      - name: Run evaluation
        timeout-minutes: 60
        run: |
          {
            echo "import sys; sys.argv = ['colab_eval.py', '--model_path', 'outputs/train_multicam_mvdet_style_v3/model_final.pth', '--fusion_mode', '${{ inputs.fusion_mode }}', '--backbone', '${{ inputs.backbone }}']"
            cat scripts/colab_eval.py
          } | colab exec -s bev-eval --timeout 3600

      - name: Download results
        if: always()
        run: |
          REMOTE="/content/BEV_Track-Predict/outputs"
          colab download -s bev-eval "$REMOTE/eval_results.json"                  ./eval_results.json    || true
          colab download -s bev-eval "$REMOTE/visualization/bev_prediction.png"   ./bev_prediction.png   || true
          colab download -s bev-eval "$REMOTE/visualization/bev_overlay.png"      ./bev_overlay.png      || true

      - name: Print results summary
        if: always()
        run: |
          if [ -f eval_results.json ]; then
            python3 -c "
          import json
          r = json.load(open('eval_results.json'))
          print('=' * 50)
          print('EVALUATION RESULTS')
          print('=' * 50)
          if 'det_moda' in r:
              print(f'{\"MODA\":20s}: {r[\"det_moda\"]:.4f}')
              print(f'{\"MODP\":20s}: {r[\"det_modp\"]:.4f}')
              print(f'{\"Precision\":20s}: {r[\"det_precision\"]:.4f}')
              print(f'{\"Recall\":20s}: {r[\"det_recall\"]:.4f}')
              print(f'{\"F1\":20s}: {r[\"det_f1\"]:.4f}')
              print(f'{\"Best Threshold\":20s}: {r[\"det_best_threshold\"]:.2f}')
              print(f'{\"Best NMS Radius\":20s}: {r.get(\"det_best_nms_radius\", \"N/A\")}')
              print(f'{\"TP/FP/FN\":20s}: {int(r[\"det_moda_tp\"])}/{int(r[\"det_moda_fp\"])}/{int(r[\"det_moda_fn\"])}')
          print('=' * 50)
          "
          else
            echo "[ERROR] eval_results.json not found — evaluation failed"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bev-eval-run${{ github.run_number }}
          path: |
            eval_results.json
            bev_prediction.png
            bev_overlay.png
          if-no-files-found: warn

      - name: Stop Colab session
        if: always()
        run: colab stop -s bev-eval || true
